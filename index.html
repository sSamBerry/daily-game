<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Push Puzzle</title>
    <!-- Tailwind via CDN for a quick launch. Swap for a real Tailwind build
         later (see README) once you want faster page loads. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Baloo 2 + DM Mono — the game's own display/mono fonts (same family
         used on /home), loaded globally since this is the primary experience
         now, not lazily injected per-route. Noto Sans Old North Arabian is
         Xenoglyph's alien-transmission glyph font (/xenoglyph) — bold,
         angular consonant letters from an undeciphered ancient script. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+Old+North+Arabian&display=swap" rel="stylesheet" />
    <style>
      /* This is a drag-driven mobile game — the page itself should never
         scroll or rubber-band, only the app's own internal overlays do. */
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #ffe9f3;
      }
      #root {
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
